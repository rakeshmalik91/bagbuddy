[build]
  # The app lives in webapp/, so Netlify has to build from there. Paths after
  # this point are relative to that directory, which is why publish is "dist".
  base = "webapp"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or a deploy looks unchanged after it lands.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"