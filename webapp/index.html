<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS ignores SVG icons, so a PNG comes first and the SVG is the modern pick. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/bagbuddy-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <link rel="canonical" href="https://bag-buddy.netlify.app/" />
    <title>BagBuddy</title>
    <meta
      name="description"
      content="BagBuddy is your luggage balance copilot: drag items into your bags and see each bag's total weight. Free, private, and it all stays in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bag-buddy.netlify.app/" />
    <meta property="og:title" content="BagBuddy — visual baggage organiser" />
    <meta
      property="og:description"
      content="Drag items into your bags and see each bag's total weight. Free, private, and it all stays in your browser."
    />
    <meta property="og:image" content="/bagbuddy-icon.svg" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try {
        var stored = localStorage.getItem('bagbuddy:theme')
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {
        // Storage blocked, so just follow the system.
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
